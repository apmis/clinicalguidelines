services:
  - type: web
    name: healthstack-guidelines-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PINECONE_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: PUBMED_API_KEY
        sync: false
      - key: PUBMED_EMAIL
        sync: false

  - type: web
    name: healthstack-guidelines-ui
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      streamlit run streamlit_app.py
      --server.address 0.0.0.0
      --server.port $PORT
      --server.headless true
    healthCheckPath: /_stcore/health
    autoDeployTrigger: commit
    envVars:
      - key: GUIDELINES_API_URL
        fromService:
          type: web
          name: healthstack-guidelines-api
          property: hostport
