[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "healthstack-guidelines-implementation"
version = "0.1.0"
description = "Standalone clinical-guideline retrieval and grounded-answer service"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pinecone>=7,<8",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.8,<3.0",
  "python-dotenv>=1.0,<2.0",
  "uvicorn>=0.34,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.guidelines" = ["prompts/*.md"]
